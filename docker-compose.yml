# docker-compose.yml (voor Portainer)
version: '3.8'

services:
  energie-app:
    build: .
    container_name: energie_react_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_HA_URL: ${NEXT_PUBLIC_HA_URL:-http://homeassistant.local:8123}